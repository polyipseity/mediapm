# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run tests
        run: cargo --locked test-all

      - name: Run doctests and rustdoc
        run: cargo --locked test-doc-all

      - name: Build project
        run: |
          cargo --locked bin rumdl check
          cargo --locked clippy-all
          cargo --locked fmt-check
          cargo --locked build-all

  # Release: the profile the shipped artifacts are built in.
  #
  # Why this is its own job rather than a step in `build`: the completion
  # scripts are rendered by each package's build script, and rendering used to
  # return early unless the profile was release. CI builds debug, so nothing in
  # this workflow ran the generator, and a CLI whose binary entry point had been
  # broken for three months still built and shipped here.
  #
  # Three packages, not the workspace: they are the ones whose build scripts
  # render completions, and a release build of every crate would spend the job's
  # budget on packages this gate does not cover.
  #
  # No skip flag is set, and that is the point. `MEDIAPM_SKIP_COMPLETION_BUILD`
  # no longer exists; a job that skipped generation would guard nothing.
  release:
    name: "Release Build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Build the completion-generating packages in release
        run: >-
          cargo --locked build --release --package mediapm-cas --package mediapm-conductor
          --package mediapm

  # Feature combinations: one `cargo check` per crate per combination.
  #
  # The combinations are derived from `cargo metadata` by the runner, not
  # listed here: a hand-maintained list is a list that silently rots when a
  # crate gains a feature. The three gotchas a reader of the old inline list
  # had to be told (the meaning of `--no-default-features` for
  # `mediapm-utils`, the `required-features = ["cli"]` bin targets, and the
  # deliberate absence of `--all-targets`) are now properties of the
  # derivation and are documented in `scripts/test-runner/src/matrix.rs`.
  #
  # Two `--locked` flags, guarding two different builds: the outer one is a
  # cargo flag guarding the `test-runner` build, the inner one reaches the
  # runner and is what each spawned `cargo check` carries.
  feature-matrix:
    name: "Feature Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Check every feature combination
        run: cargo --locked run --package test-runner -- feature-matrix --locked

  # Windows: runs the workspace tests via the root `mediapm-tests` crate and the gate tests via `test-runner`.
  windows:
    name: "Windows: Workspace Tests"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run workspace tests
        run: cargo --locked test-pkg mediapm-tests

      - name: Run test-runner gate tests
        run: cargo --locked test-pkg test-runner

      # Runs each completion-generating package's build script on Windows, which
      # no other step does.
      - name: Check the completion-generating packages
        run: cargo --locked check -p mediapm-cas -p mediapm-conductor -p mediapm

      # Reaches the CAS integration test target on Windows. That target used to
      # fail to compile because a test called `std::os::unix::fs::symlink`
      # behind a runtime `ignore`, which skips a test only after the whole file
      # has compiled; the gate is `cfg(unix)` now, so the exclusion is
      # structural.
      #
      # Scoped rather than `--all-targets` for historical reasons: `is_same_file`
      # now uses FFI to `GetFileInformationByHandle` and no longer requires the
      # unstable `windows_by_handle` feature, so `--all-targets` is usable. The
      # scope is retained to match the existing CI contract and avoid widening
      # the job. Features stay at `--all-features`, so the narrowing is targets
      # only and the run covers the same modules every other gate does.
      - name: Check the CAS integration test target
        run: cargo --locked check -p mediapm-cas --all-features --lib --bins --examples --test mod
