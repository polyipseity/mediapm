# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run tests
        run: cargo --locked test-all

      - name: Run doctests and rustdoc
        run: cargo --locked test-doc-all

      - name: Build project
        run: |
          cargo --locked bin rumdl check
          cargo --locked clippy-all
          cargo --locked fmt-check
          cargo --locked build-all

  # Feature combinations: one `cargo check` per crate per combination.
  #
  # The combinations are derived from `cargo metadata` by the runner, not
  # listed here: a hand-maintained list is a list that silently rots when a
  # crate gains a feature. The three gotchas a reader of the old inline list
  # had to be told (the meaning of `--no-default-features` for
  # `mediapm-utils`, the `required-features = ["cli"]` bin targets, and the
  # deliberate absence of `--all-targets`) are now properties of the
  # derivation and are documented in `scripts/test-runner/src/matrix.rs`.
  #
  # Two `--locked` flags, guarding two different builds: the outer one is a
  # cargo flag guarding the `test-runner` build, the inner one reaches the
  # runner and is what each spawned `cargo check` carries.
  feature-matrix:
    name: "Feature Matrix"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Check every feature combination
        run: cargo --locked run --package test-runner -- feature-matrix --locked

  # Windows: runs ONLY the workspace tests via the root `mediapm-tests` crate.
  windows:
    name: "Windows: Workspace Tests"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run workspace tests
        run: cargo --locked test-pkg mediapm-tests
