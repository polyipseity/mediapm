# CI: Build & Test
#
# Purpose:
#   - Run repository checks: setup, install, test, and build.
#   - Ensure a minimal, reproducible environment for quick CI feedback.
#
# Triggers:
#   - push, pull_request, workflow_dispatch
#
# Security & reproducibility notes:
#   - Use least-privilege permissions (contents: read) and pin action versions where appropriate.
#   - Use local caches to speed builds and reduce external load.

name: "CI: Build & Test"

on:
  pull_request:
  push:
    branches:
      - "**" # Listen to pushes on all branches
    tags-ignore:
      - "**" # Ignore tag pushes
  workflow_dispatch:

# Use concurrency to deduplicate runs.
# - For pull requests: group by `pr-<number>` so multiple commits to the same PR
#   cancel previous runs and only the latest is kept.
# - For direct pushes: fall back to deduplicating by commit SHA so identical
#   commits don't trigger multiple concurrent workflows.
# - Include the `github.workflow` name in the group to avoid cross-workflow collisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run tests
        run: scripts/run-all-tests.sh

      - name: Run large tests
        run: scripts/run-all-tests.sh --large

      - name: Build project
        run: |
          cargo --locked bin rumdl check
          cargo --locked clippy-all
          cargo --locked fmt-check
          cargo --locked build-all
          cargo --locked doc --no-deps --workspace --all-features --document-private-items

  # Feature matrix: one `cargo check` per crate per feature combination.
  #
  # Regenerate when a crate gains or loses a feature, or the matrix quietly
  # stops covering it. Order within a package: `--no-default-features`, each
  # single feature alphabetically, then `--all-features`. Crates with no
  # `[features]` section get those two endpoints only. Packages alphabetical.
  #
  # Three things a reader will otherwise get wrong:
  #
  # 1. `--no-default-features` is not a minimal build of `mediapm-utils` via
  #    `mediapm` or `mediapm-conductor`. Both force features on regardless.
  #    Only probing `mediapm-utils` directly gives a minimal build.
  # 2. Eight bin targets need `required-features = ["cli"]`, so cargo skips
  #    them on every probe without it. Expected, not a failure.
  # 3. No `--all-targets`, so `#[cfg(test)]` code depending on an optional
  #    dependency goes unchecked. Adding it would unify dev-dependency
  #    features across all probes and mask a genuinely missing dependency.
  feature-matrix:
    name: "Feature Matrix: ${{ matrix.package }} ${{ matrix.flags }}"
    runs-on: ubuntu-latest
    strategy:
      # Every probe must report, so one broken combination does not hide the
      # rest of the matrix.
      fail-fast: false
      matrix:
        include:
          # build-utils (no [features] section)
          - { package: "build-utils", flags: "--no-default-features" }
          - { package: "build-utils", flags: "--all-features" }
          # cargo-bin (no [features] section)
          - { package: "cargo-bin", flags: "--no-default-features" }
          - { package: "cargo-bin", flags: "--all-features" }
          # mediapm: cli, media-tagger, proptest
          - { package: "mediapm", flags: "--no-default-features" }
          - { package: "mediapm", flags: "--features cli" }
          - { package: "mediapm", flags: "--features media-tagger" }
          - { package: "mediapm", flags: "--features proptest" }
          - { package: "mediapm", flags: "--all-features" }
          # mediapm-cas: cli, large-tests
          - { package: "mediapm-cas", flags: "--no-default-features" }
          - { package: "mediapm-cas", flags: "--features cli" }
          - { package: "mediapm-cas", flags: "--features large-tests" }
          - { package: "mediapm-cas", flags: "--all-features" }
          # mediapm-conductor: cli, fetch, progress, proptest, tool-presets
          - { package: "mediapm-conductor", flags: "--no-default-features" }
          - { package: "mediapm-conductor", flags: "--features cli" }
          - { package: "mediapm-conductor", flags: "--features fetch" }
          - { package: "mediapm-conductor", flags: "--features progress" }
          - { package: "mediapm-conductor", flags: "--features proptest" }
          - { package: "mediapm-conductor", flags: "--features tool-presets" }
          - { package: "mediapm-conductor", flags: "--all-features" }
          # mediapm-conductor-builtin-archive: cli
          - { package: "mediapm-conductor-builtin-archive", flags: "--no-default-features" }
          - { package: "mediapm-conductor-builtin-archive", flags: "--features cli" }
          - { package: "mediapm-conductor-builtin-archive", flags: "--all-features" }
          # mediapm-conductor-builtin-echo: cli
          - { package: "mediapm-conductor-builtin-echo", flags: "--no-default-features" }
          - { package: "mediapm-conductor-builtin-echo", flags: "--features cli" }
          - { package: "mediapm-conductor-builtin-echo", flags: "--all-features" }
          # mediapm-conductor-builtin-export: cli
          - { package: "mediapm-conductor-builtin-export", flags: "--no-default-features" }
          - { package: "mediapm-conductor-builtin-export", flags: "--features cli" }
          - { package: "mediapm-conductor-builtin-export", flags: "--all-features" }
          # mediapm-conductor-builtin-fs: cli
          - { package: "mediapm-conductor-builtin-fs", flags: "--no-default-features" }
          - { package: "mediapm-conductor-builtin-fs", flags: "--features cli" }
          - { package: "mediapm-conductor-builtin-fs", flags: "--all-features" }
          # mediapm-conductor-builtin-import: cli, fetch
          - { package: "mediapm-conductor-builtin-import", flags: "--no-default-features" }
          - { package: "mediapm-conductor-builtin-import", flags: "--features cli" }
          - { package: "mediapm-conductor-builtin-import", flags: "--features fetch" }
          - { package: "mediapm-conductor-builtin-import", flags: "--all-features" }
          # mediapm-conductor-examples-concat-tool (no [features] section)
          - { package: "mediapm-conductor-examples-concat-tool", flags: "--no-default-features" }
          - { package: "mediapm-conductor-examples-concat-tool", flags: "--all-features" }
          # mediapm-tests (no [features] section)
          - { package: "mediapm-tests", flags: "--no-default-features" }
          - { package: "mediapm-tests", flags: "--all-features" }
          # mediapm-utils: cli, nickel, progress, report
          - { package: "mediapm-utils", flags: "--no-default-features" }
          - { package: "mediapm-utils", flags: "--features cli" }
          - { package: "mediapm-utils", flags: "--features nickel" }
          - { package: "mediapm-utils", flags: "--features progress" }
          - { package: "mediapm-utils", flags: "--features report" }
          - { package: "mediapm-utils", flags: "--all-features" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      # Unquoted so a future flagless row expands to no argument rather than
      # an empty one; every current row supplies at least one flag.
      - name: Check feature combination
        run: cargo --locked check --package ${{ matrix.package }} ${{ matrix.flags }}

  # Windows: runs ONLY the workspace tests via the root `mediapm-tests` crate.
  windows:
    name: "Windows: Workspace Tests"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Run workspace tests
        run: cargo --locked test-pkg mediapm-tests
