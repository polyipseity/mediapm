# Online: Real-Upstream Checks
#
# Purpose:
#   - Run the online demo against real upstreams: it provisions the managed
#     tool set from the real hosts and runs the full pipeline, which no gate
#     can do without reporting a third-party host's mood as a defect.
#
# Triggers:
#   - `workflow_dispatch` only. No push and no pull request reaches this file.
#
# Security & reproducibility notes:
#   - Least privilege (`contents: read`); actions pinned to the same revisions
#     `ci.yml` pins.

name: online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online:
    name: "Online: demo"
    runs-on: ubuntu-latest
    # 60 minutes: the cold build, the demo's own 600 s watchdog, and the
    # managed-tool downloads it performs against real hosts.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34a5143606
      - name: Run the online demo
        run: cargo --locked run -p mediapm --example mediapm_demo_online -- --online
