# ── cargo-nextest project config ──────────────────────────────────
#
# ── Known limitations ─────────────────────────────────────────────
#
# nextest deliberately skips doctests (/// examples).
# Fix: run `cargo test --doc` alongside `cargo nextest run`.
#
# Custom test harnesses (harness = false in Cargo.toml) are incompatible.
# nextest requires --list/--exact CLI flags that custom harnesses do not
# implement unless they use a compat library like libtest-mimic.
# Fix: run `cargo test` for harness = false crates, or migrate to libtest-mimic.
#
# Code coverage: use `cargo llvm-cov nextest`.
# Install cargo-llvm-cov via `cargo install cargo-llvm-cov`.
# See <https://nexte.st/docs/integrations/test-coverage/> for CI integration.
#
# IDE test runner: editors default to `cargo test`.  Configure:
# - VS Code: use rust-analyzer.runnables.test.overrideCommand
# - RustRover: Settings -> Build Tools -> Cargo -> Test Runner -> cargo-nextest
# - Zed: add "nextest": true to project .zed/settings.json
#
# See nextest docs for details: <https://nexte.st/>

# ── UI/UX ──────────────────────────────────────────────────────────────
# ── Default profile (local dev) ────────────────────────────────────────
# `slow-timeout` takes `{ period, terminate-after }`, and `terminate-after` counts
# periods, not seconds (nextest's own config reference: "`terminate-after`: Number
# of periods after which to terminate the test"), so a test's budget is
# `period x terminate-after`: no output for 10s marks it slow, and 60 such periods
# kill it, i.e. after 600s.
# Leak detection: warn if a test doesn't clean up child processes within 100ms.
[profile.default]
# Collect every failure in one run. Without this the default profile stops
# at the first failure, so a local full-suite run reports a truncated count
# and a later failure is invisible. `retries` is deliberately not set here:
# retrying locally would mask a flake instead of surfacing it.
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 60 }
leak-timeout = "100ms"

# ── CI profile (more conservative) ─────────────────────────────────────
# Don't fail fast — collect all failures in one run.
# Retry flaky tests up to twice before reporting failure.
# More generous budget (15s x 120 = 1800s = 30min) to account for CI resource
# contention.
[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "15s", terminate-after = 120 }

# ── Network-heavy test serialization & timeout ─────────────────────────
# `mediapm_demo`/`mediapm_demo_online` and the hermetic `all_platform` tests
# share one group: every test in it is hermetic today (the demo tests answer
# the stub chain and a localhost mock; `all_platform` answers a mock
# upstream), so nothing downloads and no test reaches the real upstream — the
# group stays as serialization insurance for these example binaries, and the
# filter matches the `all_platform` module those tests live in. `binary()` is
# exact-match on example binary names; `test(all_platform)` matches the
# integration tests by name contains. Non-network tests in these binaries are
# fast and just join the group.
#
# The budget is `period x terminate-after` = 60s x 12 = 720s (12 minutes) per
# test, derived from the demo's own watchdog rather than picked for feel:
# `DEMO_ONLINE_HARD_TIMEOUT_TOTAL_SECS` (600s) plus
# `DEMO_ONLINE_HARD_TIMEOUT_GRACE_SECS` (15s) in
# src/mediapm/examples/mediapm_demo_online.rs is when the demo exits by itself
# with a diagnosable message, so nextest must terminate strictly later or it
# replaces that message with its own kill. 615s / 60s = 10.25 periods, so 11
# periods (660s) clears the deadline by 45s and 12 periods (720s) leaves a whole
# period of margin for a host where the demo reaches its own deadline slowly.
# The comparison that holds is therefore a duration against a duration; there is
# no period count that "equals" the demo's seconds. `default` and `ci` are the
# profiles the demo runs under locally and in CI, and both override the budget
# identically.
[test-groups]
network = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(mediapm_demo) or binary(mediapm_demo_online) or test(all_platform)'
test-group = 'network'
slow-timeout = { period = "60s", terminate-after = 12 }

[[profile.ci.overrides]]
filter = 'binary(mediapm_demo) or binary(mediapm_demo_online) or test(all_platform)'
test-group = 'network'
slow-timeout = { period = "60s", terminate-after = 12 }
