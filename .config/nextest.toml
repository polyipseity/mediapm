# ── cargo-nextest project config ──────────────────────────────────
#
# ── Known limitations ─────────────────────────────────────────────
#
# nextest deliberately skips doctests (/// examples).
# Fix: run `cargo test --doc` alongside `cargo nextest run`.
#
# Custom test harnesses (harness = false in Cargo.toml) are incompatible.
# nextest requires --list/--exact CLI flags that custom harnesses do not
# implement unless they use a compat library like libtest-mimic.
# Fix: run `cargo test` for harness = false crates, or migrate to libtest-mimic.
#
# Code coverage: use `cargo llvm-cov nextest`.
# Install cargo-llvm-cov via `cargo install cargo-llvm-cov`.
# See <https://nexte.st/docs/integrations/test-coverage/> for CI integration.
#
# IDE test runner: editors default to `cargo test`.  Configure:
# - VS Code: use rust-analyzer.runnables.test.overrideCommand
# - RustRover: Settings -> Build Tools -> Cargo -> Test Runner -> cargo-nextest
# - Zed: add "nextest": true to project .zed/settings.json
#
# See nextest docs for details: <https://nexte.st/>

# ── UI/UX ──────────────────────────────────────────────────────────────
# ── Default profile (local dev) ────────────────────────────────────────
# Per-test timeout: kill a test that runs >60s with no output.
# Leak detection: warn if a test doesn't clean up child processes within 100ms.
[profile.default]
# Collect every failure in one run. Without this the default profile stops
# at the first failure, so a local full-suite run reports a truncated count
# and a later failure is invisible. `retries` is deliberately not set here:
# retrying locally would mask a flake instead of surfacing it.
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 60 }
leak-timeout = "100ms"

# ── CI profile (more conservative) ─────────────────────────────────────
# Don't fail fast — collect all failures in one run.
# Retry flaky tests up to twice before reporting failure.
# More generous timeout (2min) to account for CI resource contention.
[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "15s", terminate-after = 120 }

# ── Dispatch profile (the manual real-upstream job) ────────────────────
# Selected only by `.github/workflows/online.yml`, whose inputs reach real
# upstreams from a cold runner: the workspace is built from scratch, every
# managed tool's payload is provisioned for every OS slot, and a video is
# downloaded. None of that lands on a test's output pipe, so `default`'s
# budget kills a healthy test for the runner's pace and reports it as a
# defect. No fail-fast, so a run still reports every subject it was given; no
# retries, because a real-upstream failure is the result and a retry would
# turn an upstream's answer into a pass. `inherits` keeps the default
# profile's leak detection; this profile's override comes last in the network
# section below, and nextest applies the last matching override, so the
# dispatch job's subjects get the longer budget.
[profile.online]
inherits = "default"
fail-fast = false
retries = 0
# `terminate-after` counts periods, not seconds: 30s x 60 = 30 minutes per
# test. Sized for the provisioning work above rather than for a local run, and
# still inside the job's 60-minute timeout, so nextest names the test it killed
# instead of the runner cancelling the job mid-step.
slow-timeout = { period = "30s", terminate-after = 60 }

# ── Network-heavy test serialization & timeout ─────────────────────────
# Demo examples and the all_platform integration tests each download the full
# managed-tool set (ffmpeg ~163M, etc.) into a fresh empty cache. 3-7 running in
# parallel saturate bandwidth, so a test can emit no output past the 60s/120s
# slow-timeout and get killed (exit 124). Serialize them (max-threads = 1) and
# give a generous terminate-after. `binary()` is exact-match on example binary
# names; `test(all_platform)` matches the integration tests by name contains.
# Non-network tests in these binaries are fast and just join the group.
# terminate-after = 600 MUST stay equal to DEMO_ONLINE_HARD_TIMEOUT_TOTAL_SECS in
# src/mediapm/examples/mediapm_demo_online.rs (watchdog and runner are synced).
# That equality binds `default` and `ci`, the profiles the demo is run under
# locally and in CI. `profile.online` is exempt on purpose: the dispatch job
# runs the demo as the example binary (`cargo run --example
# mediapm_demo_online`), so the watched run is the example's own watchdog and
# not a nextest test paired with the runner's budget. The online budget bounds
# the two ignored twins, which carry no in-process watchdog and whose work
# depends on a cold runner's download pace, so it is sized for that work
# instead of mirroring the demo's constant.
[test-groups]
network = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(mediapm_demo) or binary(mediapm_demo_online) or test(all_platform)'
test-group = 'network'
slow-timeout = { period = "60s", terminate-after = 600 }

[[profile.ci.overrides]]
filter = 'binary(mediapm_demo) or binary(mediapm_demo_online) or test(all_platform)'
test-group = 'network'
slow-timeout = { period = "60s", terminate-after = 600 }

# Every subject of the dispatch job: the demo binaries with their siblings in
# `default`/`ci`, plus the YouTube twin `test(all_platform)` does not match.
# One group across profiles keeps the twins serialized even though the workflow
# runs them in separate steps — they share the job's bandwidth.
[[profile.online.overrides]]
filter = 'binary(mediapm_demo) or binary(mediapm_demo_online) or test(all_platform) or test(youtube_regression)'
test-group = 'network'
slow-timeout = { period = "30s", terminate-after = 60 }
