[package]
name = "mediapm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Media orchestration facade over conductor and CAS"

[features]
default = ["cli", "media-tagger"]
cli = [
  "dep:clap",
  "dep:clap_complete",
  "mediapm-cas/cli",
  "mediapm-conductor/cli",
]
media-tagger = ["dep:chromaprint-next", "dep:musicbrainz_rs", "dep:ffmetadata"]
proptest = []
# Test-only seam for the provider base URLs. Every gate passes `--all-features`,
# so the seam is active wherever the suite runs; a release build leaves it off,
# which is what makes the environment unable to redirect a shipped binary.
test-seams = []

[lints]
workspace = true

[lib]
name = "mediapm"
path = "src/lib.rs"

[[bin]]
name = "mediapm"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
chromaprint-next = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "std"], optional = true }
clap_complete = { workspace = true, optional = true }
dotenvy.workspace = true
ffmetadata = { workspace = true, optional = true }
futures-util.workspace = true
libc.workspace = true
mediapm-cas = { path = "../mediapm-cas", default-features = false }
mediapm-utils = { workspace = true, features = ["nickel", "progress", "report"] }
# The conductor's tool-presets surface is not optional for this crate: the config
# types, the sync bridge, and the workflow options it passes all use it directly,
# in code that no feature of this crate gates. Declaring the requirement here is
# what makes `--no-default-features` a build rather than a compile error.
mediapm-conductor = { path = "../mediapm-conductor", default-features = false, features = [
  "tool-presets",
] }
musicbrainz_rs = { workspace = true, features = [
  "async",
  "rustls",
], optional = true }
nickel-lang-core.workspace = true
parking_lot.workspace = true
regex.workspace = true
console.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
unicode-normalization.workspace = true
zip.workspace = true

[build-dependencies]
build-utils = { path = "../../scripts/build-utils" }

[dev-dependencies]
indicatif = { workspace = true, features = ["in_memory"] }
mediapm-test-support = { path = "../mediapm-test-support", features = ["test-seams"] }
proptest.workspace = true
same-file.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
