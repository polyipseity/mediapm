[package]
name = "mediapm-utils"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Shared utility types, path helpers, and builtin boilerplate for mediapm crates"

[features]
default = []
cli = ["dep:clap"]
nickel = ["dep:serde_json"]
progress = ["dep:indicatif", "dep:console", "dep:tokio", "dep:serde_json"]
report = ["dep:console"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "std"], optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, features = ["tokio"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tempfile.workspace = true

[dev-dependencies]
indicatif = { workspace = true, features = ["in_memory"] }
# Test-only: the in-crate `timestamp` unit test round-trips the unconditional
# `serde` derive through `serde_json`. Library code never needs it, so it stays
# optional in `[dependencies]` and is enabled here for test builds alone.
serde_json.workspace = true
tempfile.workspace = true

# The frame suite imports `DimensionSource`, `ProgressDebugSink`,
# `ProgressTerminal`, `TestDimensionSource`, `TestTimeSource` and `TimeSource`,
# all re-exported from a `#[cfg(feature = "progress")]` block. Declaring the
# requirement here is what keeps a minimal-feature build of the test targets
# working: without it the target is compiled unconditionally and those imports
# do not resolve.
[[test]]
name = "progress_output"
required-features = ["progress"]
