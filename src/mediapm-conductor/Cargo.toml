[package]
name = "mediapm-conductor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Orchestration contracts and state model for mediapm"

[features]
default = ["cli"]
progress = ["mediapm-utils/progress"]
cli = [
  "dep:clap",
  "dep:clap_complete",
  "mediapm-cas/cli",
  "mediapm-utils/report",
  "progress",
  "tool-presets",
  "fetch",
]
fetch = ["mediapm-conductor-builtin-import/fetch"]
proptest = []
# Test-only seam, the same switch `mediapm` declares. Declared here so a test
# crate that links the conductor can turn it on by name, and so the feature
# matrix covers the combination.
test-seams = []
tool-presets = ["dep:flate2", "dep:tar", "dep:xz2", "dep:sha2", "progress"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "std"], optional = true }
clap_complete = { workspace = true, optional = true }
dashmap.workspace = true
dirs.workspace = true
dotenvy.workspace = true
flate2 = { workspace = true, optional = true }
futures-util.workspace = true
mediapm-cas = { path = "../mediapm-cas", default-features = false }
mediapm-utils = { workspace = true, features = ["nickel"] }
mediapm-conductor-builtin-echo = { path = "../mediapm-conductor-builtins/echo", default-features = false }
mediapm-conductor-builtin-fs = { path = "../mediapm-conductor-builtins/fs", default-features = false }
mediapm-conductor-builtin-import = { path = "../mediapm-conductor-builtins/import", default-features = false }
mediapm-conductor-builtin-archive = { path = "../mediapm-conductor-builtins/archive", default-features = false }
mediapm-conductor-builtin-export = { path = "../mediapm-conductor-builtins/export", default-features = false }
nickel-lang-core.workspace = true
ractor.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
xz2 = { workspace = true, optional = true }
# Not optional: folder-regex capture archives its matched sandbox files as a
# ZIP blob from the step executor, which is core capture behavior rather than
# managed-tool provisioning, so the codec is required in every configuration.
zip = { workspace = true }

[dev-dependencies]
mediapm-test-support = { path = "../mediapm-test-support", features = ["test-seams"] }
proptest.workspace = true
wiremock = "0.6"

[build-dependencies]
build-utils = { path = "../../scripts/build-utils" }

[[bin]]
name = "mediapm-conductor"
path = "src/main.rs"
required-features = ["cli"]
