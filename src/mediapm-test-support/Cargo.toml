[package]
name = "mediapm-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Dev-only mock upstream and synthetic tool payloads for mediapm hermetic tests"

# A stand-in managed-tool executable for hermetic tests: it lets a test run a
# step whose tool is a downloaded binary, and it replaces the shell-based
# stand-ins whose platform dependency this crate exists to remove. Located by
# path through `stub_tool::stub_tool_path`, because `CARGO_BIN_EXE_*` names the
# current package's binaries only.
[[bin]]
name = "mediapm-stub-tool"
path = "src/bin/mediapm-stub-tool.rs"

[lints]
workspace = true

[dependencies]
# `wiremock` is a normal dependency rather than a dev-dependency because the
# mock's server is part of this crate's public surface. It still cannot reach a
# shipped binary: this crate is only ever a dev-dependency of its consumers.
wiremock = "0.6"
flate2.workspace = true
# The env-var registry table (`env_registry.rs`) is non-test code and uses the
# shared `EnvVarEntry` type. The type lives in mediapm-utils, not
# mediapm-conductor: this crate must never depend back on mediapm-conductor,
# which would close the dev-dependency cycle.
mediapm-utils.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio.workspace = true
xz2.workspace = true
zip.workspace = true

[dev-dependencies]
reqwest.workspace = true
